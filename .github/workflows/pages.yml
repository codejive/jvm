name: Publish installer site
on:
  push:
    paths:
      - 'web/**'
      - 'tools/**'
      - 'tests/**'
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  checks:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ./.github/workflows/test.yml
    with:
      revision: ${{ github.sha }}
  stage:
    needs: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify public release before exposing latest.txt
        run: |
          python3 tools/pages-preflight.py
          python3 tools/package-release.py "$(cat web/latest.txt)" "$RUNNER_TEMP/site" --site
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ runner.temp }}/site
  deploy:
    needs: stage
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Refuse stale queued revision
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.repository.default_branch }}
          REVISION: ${{ github.sha }}
        run: test "$(gh api "repos/$GH_REPO/commits/$BRANCH" --jq .sha)" = "$REVISION"
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
